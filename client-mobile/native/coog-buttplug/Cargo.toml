[package]
name = "coog_buttplug"
version = "0.1.0"
edition = "2021"
description = "In-process Intiface engine for Coog mobile (BLE via btleplug)"
license = "BSD-3-Clause"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]
name = "coog_buttplug"

[dependencies]
intiface-engine = "5.0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
once_cell = "1.21"
log = "0.4"
android_logger = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
btleplug = "0.13"

# Solace Pro hard-stop: halt FSetSite seeker + Mply:0:0 (see vendor/.../lovense_stroker.rs).
[patch.crates-io]
buttplug_server = { path = "vendor/buttplug_server" }
